name: Build TandOrbit

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install ".[dev]" pyinstaller
      - name: Run tests
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -X faulthandler -m pytest -p pytest_asyncio.plugin -ra --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results.xml
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "v$(python -c 'from app.updater import __version__; print(__version__)')"
      - name: Build desktop app
        run: python -m PyInstaller --noconfirm packaging/tandorbit.spec
      - name: Smoke test macOS app and build DMG
        if: runner.os == 'macOS'
        run: |
          dist/TandOrbit.app/Contents/MacOS/TandOrbit --smoke-test
          mkdir dmg-files
          cp -R dist/TandOrbit.app dmg-files/
          ln -s /Applications dmg-files/Applications
          hdiutil create -volname TandOrbit -srcfolder dmg-files -ov -format UDZO dist/TandOrbit-macOS.dmg
      - name: Smoke test and ZIP Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/TandOrbit/TandOrbit.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          Copy-Item scripts/install_agent.bat,scripts/uninstall_agent.bat -Destination dist/TandOrbit/
          Compress-Archive -Path dist/TandOrbit/* -DestinationPath dist/TandOrbit-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TandOrbit-${{ matrix.os }}
          path: |
            dist/TandOrbit-macOS.dmg
            dist/TandOrbit-Windows.zip

  release:
    needs: test-and-build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: TandOrbit-*
          merge-multiple: true
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
