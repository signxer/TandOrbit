name: Build TandOrbit

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-version:
    name: Verify version consistency
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check tag matches code version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # 直接解析 updater.py 中的 __version__，避免安装依赖后再 import
          CODE_VER=$(grep -oE '__version__ = "[0-9]+\.[0-9]+\.[0-9]+"' app/updater.py | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "tag=${TAG} code=${CODE_VER}"
          if [ "${TAG}" != "v${CODE_VER}" ]; then
            echo "::error::发布 tag ${TAG} 与代码版本 v${CODE_VER} 不一致，请先更新 app/updater.py 的 __version__ 与 pyproject.toml"
            exit 1
          fi


  build-mac:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        shell: bash
        env:
          # Windows 控制台默认 cp1252, 任何中文输出都会让 python 崩溃
          # (v2.1.3 起 test_version 含中文输出后, pytest 全过却 exit 1 的根因)
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python -m pytest tests/ -v --tb=long -ra --junitxml=test-results.xml || true

      - name: Verify test results
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python scripts/check_test_results.py test-results.xml

      - name: Build macOS executable
        run: pyinstaller -F -w --icon=resources/icon.icns --add-data="resources:resources" --add-data="config:config" --hidden-import=sqlite3 --hidden-import=_sqlite3 --runtime-hook=packaging/runtime_hook.py --name=TandOrbit app/main.py

      - name: Create .app bundle
        run: |
          APP_VERSION=$(python3 -c "from app.updater import __version__; print(__version__)")
          mkdir -p TandOrbit.app/Contents/MacOS
          mkdir -p TandOrbit.app/Contents/Resources
          cp dist/TandOrbit TandOrbit.app/Contents/MacOS/
          cp resources/icon.icns TandOrbit.app/Contents/Resources/
          cat > TandOrbit.app/Contents/Info.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>TandOrbit</string>
          <key>CFBundleIconFile</key><string>icon.icns</string>
          <key>CFBundleName</key><string>TandOrbit</string>
          <key>CFBundleIdentifier</key><string>com.tandorbit.app</string>
          <key>CFBundleVersion</key><string>${APP_VERSION}</string>
          <key>CFBundleShortVersionString</key><string>${APP_VERSION}</string>
          <key>NSHighResolutionCapable</key><true/>
          <key>LSUIElement</key><true/>
          </dict></plist>
          EOF

      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "TandOrbit" \
            --volicon "resources/dmg_icon.icns" \
            --background "resources/dmg_background.png" \
            --window-pos 200 120 \
            --window-size 640 440 \
            --icon-size 120 \
            --icon "TandOrbit.app" 220 200 \
            --hide-extension "TandOrbit.app" \
            --app-drop-link 420 200 \
            --no-internet-enable \
            "dist/TandOrbit-macOS.dmg" \
            "TandOrbit.app" || {
              mkdir -p dmg-dist
              cp -r TandOrbit.app dmg-dist/
              ln -sf /Applications dmg-dist/Applications
              hdiutil create -volname TandOrbit -srcfolder dmg-dist -ov -format UDZO dist/TandOrbit-macOS.dmg
            }

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: TandOrbit-macOS
          path: dist/TandOrbit-macOS.dmg

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        shell: bash
        env:
          # Windows 控制台默认 cp1252, 任何中文输出都会让 python 崩溃
          # (v2.1.3 起 test_version 含中文输出后, pytest 全过却 exit 1 的根因)
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python -m pytest tests/ -v --tb=long -ra --junitxml=test-results.xml || true

      - name: Verify test results
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python scripts/check_test_results.py test-results.xml

      - name: Build Windows GUI
        run: pyinstaller packaging/tandorbit.spec --noconfirm

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: TandOrbit-Windows
          path: dist/TandOrbit/

  release:
    name: Create Release
    needs: [verify-version, build-mac, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: TandOrbit-macOS
          path: artifacts/mac

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: TandOrbit-Windows
          path: artifacts/windows

      - name: Zip Windows build
        run: cd artifacts/windows && zip -r ../../TandOrbit-Windows.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/mac/TandOrbit-macOS.dmg
            TandOrbit-Windows.zip
          generate_release_notes: true
          draft: false
          prerelease: false
