# TandOrbit 默认配置文件

display:
  primary_id: 1
  secondary_id: 2
  share_display_id: 2
  ddc_primary_monitor: '\\.\DISPLAY1\Monitor0'
  ddc_secondary_monitor: '\\.\DISPLAY2\Monitor0'
  auto_repair: false          # 启动时按上次模式自愈显示器状态（默认关闭）

windows:
  host: "192.168.1.100"
  port: 5000
  timeout: 10.0

mac:
  host: "192.168.1.100"
  port: 5001

deskflow:
  auto_restart: true
  server_host: "192.168.1.100"
  server_port: 24800
  client_name: "mac"
  is_server: null             # null = 按平台自动判断（Windows=服务端，Mac=客户端）

betterdisplay:
  cli_path: "/Applications/BetterDisplay.app/Contents/MacOS/betterdisplaycli"

audio:
  mac_output: "AirPods"
  windows_output: "USB DAC"

tools:
  multimonitortool_path: "MultiMonitorTool.exe"
  controlmymonitor_path: "ControlMyMonitor.exe"
  deskflow_path: "deskflow.exe"

hotkeys:
  switch_mac: "Ctrl+Alt+1"
  switch_windows: "Ctrl+Alt+2"
  switch_share: "Ctrl+Alt+3"

wol_nic: ""
last_mode: null

log_level: "INFO"
log_dir: "logs"
log_retention_days: 30
