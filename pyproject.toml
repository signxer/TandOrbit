[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tandorbit"
version = "2.2.9"
description = "TandOrbit — 双机双屏智能协同管理平台"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "Shuheng Cao"},
]
dependencies = [
    "PySide6-Essentials>=6.6.0,<7",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "loguru>=0.7.2",
    "httpx>=0.27.0",
    "uvicorn>=0.35.0",
    "starlette>=0.38.0",
    "cryptography>=43.0",
    "websockets>=15.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<9",
    "pytest-asyncio>=0.23.0,<1.3",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.scripts]
tandorbit = "app.main:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"


[tool.setuptools.packages.find]
include = ["app*", "plugins*"]

[tool.setuptools.data-files]
"share/tandorbit/resources" = ["resources/*.png", "resources/*.svg", "resources/*.ico", "resources/*.icns"]
"share/tandorbit/config" = ["config/default.yaml"]
